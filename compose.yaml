name: dubious-doubles

x-database-url: &database-url postgres://dubious_doubles:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/dubious_doubles?sslmode=disable

services:
  db:
    image: postgres:18.6-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    environment:
      POSTGRES_USER: dubious_doubles
      POSTGRES_DB: dubious_doubles
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U dubious_doubles -d dubious_doubles']
      interval: 2s
      timeout: 2s
      retries: 30
  migrate:
    build:
      context: backend
      target: migrate
    environment:
      GOOSE_DRIVER: postgres
      GOOSE_DBSTRING: *database-url
    depends_on:
      db:
        condition: service_healthy
  api:
    build:
      context: backend
      target: api
    environment:
      DATABASE_URL: *database-url
      HTTP_ADDR: :8080
      DATABASE_TIMEOUT: 2s
    ports:
      - '127.0.0.1:${API_PORT:-8080}:8080'
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, 'http://127.0.0.1:8080/readyz']
      interval: 2s
      timeout: 3s
      retries: 30
    stop_grace_period: 15s

volumes:
  postgres-data:
